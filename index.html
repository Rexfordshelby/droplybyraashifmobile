    <style>
      :root {
        --boot-bg: #f7fafc;
        --boot-heading: #0f172a;
        --boot-text: #475569;
        --boot-primary: #0f8f83;
        --boot-blue: #1265e8;
        --boot-border: #dde5ee;
      }

      html,
      body,
      #root {
        min-height: 100%;
      }

      body {
        margin: 0;
        background:
          radial-gradient(circle at 84% 18%, rgba(18, 101, 232, 0.1), transparent 35%),
          radial-gradient(circle at 12% 82%, rgba(15, 143, 131, 0.1), transparent 35%),
          var(--boot-bg);
      }

      .boot-splash {
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        color: var(--boot-heading);
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      .boot-card {
        width: min(100%, 360px);
        border: 1px solid var(--boot-border);
        border-radius: 22px;
        background: rgba(255, 255, 255, 0.94);
        box-shadow: 0 20px 55px rgba(15, 23, 42, 0.08);
        padding: 28px 24px;
        text-align: center;
      }

      .boot-logo {
        width: 108px;
        height: auto;
        margin: 0 auto 18px;
      }

      .boot-title {
        margin: 0;
        font-size: 1.25rem;
        font-weight: 800;
        line-height: 1.2;
      }

      .boot-copy {
        margin: 8px 0 0;
        color: var(--boot-text);
        font-size: 0.95rem;
        line-height: 1.55;
      }

      .boot-loader {
        width: 100%;
        height: 4px;
        margin-top: 22px;
        overflow: hidden;
        border-radius: 999px;
        background: #e8f7f4;
      }

      .boot-loader::before {
        content: "";
        display: block;
        width: 46%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--boot-primary), var(--boot-blue));
        animation: boot-slide 1.15s ease-in-out infinite;
      }

      @keyframes boot-slide {
        0% {
          transform: translateX(-110%);
        }
        100% {
          transform: translateX(230%);
        }
      }
    </style>
